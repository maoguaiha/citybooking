apiVersion: apps/v1
kind: Deployment
metadata:
  name: city-booking-server
  namespace: city-booking
  labels:
    app: city-booking-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: city-booking-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: city-booking-server
    spec:
      containers:
        - name: server
          image: registry.example.com/city-booking/server:latest
          ports:
            - containerPort: 18100
          envFrom:
            - configMapRef:
                name: city-booking-config
            - secretRef:
                name: city-booking-secret
          env:
            - name: DB_URL
              value: "jdbc:mysql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
          readinessProbe:
            httpGet:
              path: /api/actuator/health
              port: 18100
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/actuator/health
              port: 18100
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: city-booking-server
  namespace: city-booking
spec:
  selector:
    app: city-booking-server
  ports:
    - port: 18100
      targetPort: 18100
