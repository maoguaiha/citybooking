server:
  port: 18100
  servlet:
    context-path: /api

spring:
  application:
    name: city-booking-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
  # Redis/Redisson 仅在 prod 激活（见 prod profile）
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-please-change-in-prod-1234567890}
    expire-min: ${JWT_EXPIRE_MIN:120}
  pay:
    channel: ${PAY_CHANNEL:mock}
  dispatch:
    grab-timeout-min: ${GRAB_TIMEOUT_MIN:30}
    default-radius-m: ${DEFAULT_RADIUS_M:5000}
  refund:
    rate-accepted: ${REFUND_RATE_ACCEPTED:0.8}
  geo:
    default-city: ${GEO_DEFAULT_CITY:北京}
  wechat:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    mock: ${WX_MOCK:true}    # 开发/测试态为 true：code 直接映射为 mock openid，免真实微信配置

logging:
  level:
    com.citybooking: debug
    org.springframework.security: warn

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

---

# ========== 开发环境：本地 MySQL（数据持久化，重启不丢失，解决 ID 失效 404） ==========
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/citybooking_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
  h2:
    console:
      enabled: false

# ========== 测试环境：仍用 H2 内存库（CI 无需外部中间件，隔离开发库） ==========
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DB_URL:jdbc:h2:mem:booking;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console

# ========== 生产环境：MySQL + Redis ==========
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
  # Redis 在 prod 由 spring.redis.* 驱动（Redisson 与 RedisGeo 共用）
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8

logging:
  level:
    com.citybooking: info
    org.springframework.security: warn

