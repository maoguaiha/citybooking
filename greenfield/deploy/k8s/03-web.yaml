apiVersion: apps/v1
kind: Deployment
metadata:
  name: city-booking-web
  namespace: city-booking
  labels:
    app: city-booking-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: city-booking-web
  template:
    metadata:
      labels:
        app: city-booking-web
    spec:
      containers:
        - name: web
          image: registry.example.com/city-booking/web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: city-booking-web
  namespace: city-booking
spec:
  selector:
    app: city-booking-web
  ports:
    - port: 80
      targetPort: 80
